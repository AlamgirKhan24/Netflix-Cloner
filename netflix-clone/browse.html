<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Browse - Netflix Clone</title>
  <script>try{var s=JSON.parse(localStorage.getItem("nf-clone:v1")||"{}");document.documentElement.dataset.theme=s.theme||"dark"}catch(e){}</script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="browse">
  <header class="navbar glass" id="navbar">
    <a class="logo" href="browse.html">NETFLIX</a>
    <nav class="nav-links" aria-label="Main"><a href="browse.html" class="active">Home</a><a href="search.html">Search</a><a href="my-list.html">My List</a><a href="settings.html">Settings</a></nav>
    <div class="nav-right">
      <label class="search" id="searchBox">
        <i data-icon="search"></i>
        <input id="search" type="search" placeholder="Titles, genres" autocomplete="off" aria-label="Search titles">
      </label>
      <button class="neu round sm" id="studioBtn" aria-label="Open studio" aria-expanded="false" aria-controls="studio" data-magnetic>
        <i data-icon="tune"></i>
      </button>
      <a class="avatar" id="navAvatar" href="profiles.html" aria-label="Switch profile"></a>
    </div>
  </header>

  <section class="hero" id="hero" aria-label="Featured titles">
    <div class="hero-parallax" id="heroArt">
      <div class="hero-layer"></div>
      <div class="hero-layer"></div>
    </div>
    <div class="hero-panel glass" id="heroPanel">
      <div id="heroText">
        <p class="eyebrow">Featured</p>
        <h2 id="heroTitle"></h2>
        <div class="meta" id="heroMeta"></div>
        <p class="hero-desc" id="heroDesc"></p>
      </div>
      <div class="hero-actions">
        <button class="btn-play" id="heroPlay" data-magnetic><i data-icon="play"></i>Play</button>
        <button class="neu" id="heroInfo" data-magnetic><i data-icon="info"></i>More info</button>
        <button class="neu round" id="heroList" aria-label="Toggle My List" data-magnetic></button>
      </div>
    </div>
    <div class="hero-dots" id="heroDots" aria-label="Featured titles"></div>
  </section>

  <main id="rows">
    <div id="userRows"></div>
    <div id="catRows"></div>
    <div id="searchRows" hidden></div>
  </main>

  <footer class="footer">
    <p>Built for learning. Not affiliated with Netflix.</p>
  </footer>

  <div class="details" id="details" hidden role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="details-backdrop" id="dBackdrop"></div>
    <article class="details-card glass">
      <div class="details-art" id="dArt">
        <button class="neu round sm details-close" id="dClose" aria-label="Close details"><i data-icon="close"></i></button>
        <h2 class="details-title" id="dTitle"></h2>
      </div>
      <div class="details-info">
        <div class="details-actions">
          <button class="btn-play" id="dPlay"><i data-icon="play"></i>Play</button>
          <button class="neu" id="dList"></button>
        </div>
        <div class="meta" id="dMeta"></div>
        <p id="dDesc"></p>
        <div class="chips" id="dChips"></div>
      </div>
    </article>
  </div>

  <div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Video player">
    <video id="video" playsinline preload="metadata"></video>
    <div class="player-ui" id="playerUi">
      <div class="player-top">
        <button class="neu round" id="pClose" aria-label="Close player"><i data-icon="close"></i></button>
        <h2 id="pTitle"></h2>
      </div>
      <button class="neu big-play" id="pCenter" aria-label="Play or pause"><i data-icon="play"></i></button>
      <div class="player-bar glass">
        <div class="seek-row">
          <span id="pCur">0:00</span>
          <input class="slider" id="pSeek" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <span id="pDur">0:00</span>
        </div>
        <div class="ctrl-row">
          <button class="neu round sm" id="pPlay" aria-label="Play or pause"><i data-icon="play"></i></button>
          <div class="ctrl-group">
            <button class="neu round sm" id="pMute" aria-label="Mute"><i data-icon="volume"></i></button>
            <input class="slider short" id="pVol" type="range" min="0" max="100" value="80" aria-label="Volume">
          </div>
          <div class="ctrl-group">
            <span class="ctrl-ico"><i data-icon="sun"></i></span>
            <input class="slider short" id="pBright" type="range" min="50" max="150" value="100" aria-label="Brightness">
          </div>
          <span class="spacer"></span>
          <button class="neu pill sm" id="pSpeed" aria-label="Playback speed">1x</button>
          <button class="neu round sm" id="pFull" aria-label="Fullscreen"><i data-icon="expand"></i></button>
        </div>
      </div>
    </div>
    <div class="player-spinner" id="pSpin" hidden></div>
    <p class="player-error glass" id="pError" hidden></p>
  </div>

  <aside class="studio glass" id="studio" aria-label="Personalization studio" inert>
    <header class="studio-head">
      <h2>Studio</h2>
      <button class="neu round sm" id="studioClose" aria-label="Close studio"><i data-icon="close"></i></button>
    </header>
    <div class="studio-body">
      <section>
        <h3>Theme</h3>
        <div class="segmented" id="themeSeg">
          <button class="neu" data-theme-btn="dark">Dark</button>
          <button class="neu" data-theme-btn="light">Light</button>
          <button class="neu" data-theme-btn="oled">OLED</button>
        </div>
      </section>
      <section>
        <h3>Accent</h3>
        <div class="swatches" id="swatches">
          <button class="swatch" style="--c:#e50914" data-color="#e50914" aria-label="Red"></button>
          <button class="swatch" style="--c:#ff4d6d" data-color="#ff4d6d" aria-label="Rose"></button>
          <button class="swatch" style="--c:#ff9f1c" data-color="#ff9f1c" aria-label="Amber"></button>
          <button class="swatch" style="--c:#2ec27e" data-color="#2ec27e" aria-label="Green"></button>
          <button class="swatch" style="--c:#2d8cff" data-color="#2d8cff" aria-label="Blue"></button>
          <button class="swatch" style="--c:#9b5cff" data-color="#9b5cff" aria-label="Violet"></button>
          <input class="color-pick" id="accent" type="color" value="#e50914" aria-label="Custom accent color">
        </div>
      </section>
      <section>
        <h3>Liquid glass</h3>
        <label class="field"><span>Intensity</span><input class="slider" id="glass" type="range" min="0" max="100"></label>
        <label class="field"><span>Blur</span><input class="slider" id="blur" type="range" min="0" max="40"></label>
      </section>
      <section>
        <h3>Posters</h3>
        <label class="field"><span>Size</span><input class="slider" id="poster" type="range" min="130" max="260"></label>
        <div class="segmented" id="layoutSeg">
          <button class="neu" data-layout-btn="carousel">Carousel</button>
          <button class="neu" data-layout-btn="grid">Grid</button>
        </div>
      </section>
      <section>
        <h3>Preferences</h3>
        <label class="toggle-row"><span>Reduce motion</span><span class="toggle"><input type="checkbox" id="optReduce"><i></i></span></label>
        <label class="toggle-row"><span>Cursor glow</span><span class="toggle"><input type="checkbox" id="optGlow"><i></i></span></label>
        <label class="toggle-row"><span>Rotate featured title</span><span class="toggle"><input type="checkbox" id="optHero"><i></i></span></label>
      </section>
      <section>
        <h3>Presets</h3>
        <div class="preset-form">
          <input id="presetName" type="text" maxlength="24" placeholder="Name your look" aria-label="Preset name">
          <button class="neu pill sm" id="presetSave">Save</button>
        </div>
        <ul class="presets" id="presetList"></ul>
      </section>
      <section class="keys">
        <h3>Shortcuts</h3>
        <p><kbd>/</kbd> search <kbd>S</kbd> studio <kbd>P</kbd> play <kbd>L</kbd> my list <kbd>Esc</kbd> close</p>
        <p>Player: <kbd>Space</kbd> play <kbd>&larr;</kbd><kbd>&rarr;</kbd> seek <kbd>&uarr;</kbd><kbd>&darr;</kbd> volume <kbd>M</kbd> mute <kbd>F</kbd> fullscreen</p>
      </section>
      <button class="neu pill" id="resetLook">Reset look</button>
    </div>
  </aside>

  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/details.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
