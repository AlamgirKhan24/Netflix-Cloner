<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Search - Netflix Clone</title>
  <script>try{var s=JSON.parse(localStorage.getItem("nf-clone:v1")||"{}");document.documentElement.dataset.theme=s.theme||"dark"}catch(e){}</script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="search">
<main class="page">
  <h1 class="page-title">Search</h1>
  <input class="input big" id="q" type="search" placeholder="Titles, genres, years" autocomplete="off" aria-label="Search titles">
  <div class="filters" id="genres"></div>
  <p class="count" id="count" role="status"></p>
  <div class="grid" id="grid"></div>
</main>
<footer class="footer"><p>Built for learning. Not affiliated with Netflix.</p></footer>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
